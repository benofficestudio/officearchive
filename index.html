    <div><p>Tuesday, 15 July 2025<br>
  <b>Summer 2025</b><br><br>
  As we are heading into the summertime, here are some of the things we’ve been working on during the first months of 2025. First of all, there’s ‘Circuits’, our latest site-specific installation at Stedelijk Museum, running until December 14. We created merch and multiples for the 20th anniversary of DJVT (1,2,3, etc.), and for the 25th anniversary of Annet Gelink Gallery (1,2,3,4, etc.). We designed a record sleeve (and postcard) for Escape-ism, wrote an essay for Making & Breaking, continued working on Rice School of Architecture, created a cover for VPRO Gids, and made ‘High Street’ (the latest issue in the ongoing High Series). A lot of new exciting projects coming up (S+CS2, Prini, Sphere, PxP, ÄÄNI, etc.) but more about that later. For now, have a great summer holiday everybody!</p></div>

    <div><p>Monday, 30 December 2024<br>
  <b>This was 2024</b><br><br>
  As one exhibition (at MACRO) ended, another exhibition (at Ca’Buccari) opened – and what a show it was. In the meantime, we were working on a graphic language (and accompanying journal) for Rice School of Architecture – while we were also involved in the launch of a publication (When Technology Was Female) we designed for IICD. We created some posters for specific shows (Kyiv Perennial, Porto, Chillida), a scarf for Paradiso, a record sleeve for Escape-ism, an insert for Werker, and a new issue of the High Series. Our work was exhibited (1,2,3), reviewed (a,b,c), discussed (I,II,III), displayed, worn, re-worn, re-used, and catalogued. We wrote some bits and pieces (including a long essay that will be published in March 2025), engaged in a conversation, and continued teaching at WT. And lastly, we created a compact graphic system for the 20th anniversary of DJVT, featuring photography by Anton Corbijn. Wishing you all a great holiday season – and enjoy the hazy shades of winter.</div>
